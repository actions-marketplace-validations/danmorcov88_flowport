- type: org.apache.nifi.processors.slack.PostSlack
  kind: PROCESSOR
  bundle:
    group: org.apache.nifi
    artifact: nifi-slack-nar
  deprecated_in_source: true
  deprecation_reason: This Processor is more difficult to configure than necessary, and exposes intricate
    nuances of the Slack API that need not be exposed. Additionally, it lacks some capabilities, such
    as responding to messages in threads. It interacts directly with the Slack API instead of making use
    of the Slack-provided SDK, which makes the Processor much more brittle. Additionally, it does not
    make clear the differences between PutSlack and PostSlack. Each provides slightly different capabilities.
    PublishSlack combines the capabilities of both Processors in a simpler configuration that makes use
    of Slack's standard REST API.
  alternatives:
  - org.apache.nifi.processors.slack.PublishSlack
  jira:
  - NIFI-12331
- type: org.apache.nifi.processors.slack.PutSlack
  kind: PROCESSOR
  bundle:
    group: org.apache.nifi
    artifact: nifi-slack-nar
  deprecated_in_source: true
  deprecation_reason: This Processor makes use of a Webhook URL, rather than Slack's REST API. As a result,
    the Processor is more difficult to configure than necessary and requires special permissions for the
    Slack Application / Bot. These permissions must be granted for every channel that the application
    is to respond to, which makes setup and maintenance difficult. Additionally, it does not make clear
    the differences between PutSlack and PostSlack. Each provides slightly different capabilities. PublishSlack
    combines the capabilities of both Processors in a simpler configuration that makes use of Slack's
    standard REST API.
  alternatives:
  - org.apache.nifi.processors.slack.PublishSlack
  jira:
  - NIFI-12331
