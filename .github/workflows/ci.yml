name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the wheel
        run: python -m pip install --quiet build && python -m build --wheel
      - name: Install the wheel in a clean environment
        shell: bash
        run: |
          python -m venv clean
          if [ -x clean/bin/python ]; then py=clean/bin/python; else py=clean/Scripts/python.exe; fi
          "$py" -m pip install --quiet dist/*.whl
          echo "PY=$py" >> "$GITHUB_ENV"
      - name: Run the commands
        shell: bash
        run: |
          "$PY" -m flowport --version
          "$PY" -m flowport analyze tests/fixtures/nifi-1.28.1/flow.json.gz --fail-on never
          "$PY" -m flowport migrate all tests/fixtures/nifi-1.28.1/flow.json.gz --output out
          "$PY" -m flowport analyze out/flow.json.gz --format json --fail-on never --output out/report.json
          test -s out/report.json && test -s out/changes.json
      - name: Build the Docker image
        if: runner.os == 'Linux'
        run: docker build -t flowport:ci . && docker run --rm -v "$PWD/tests/fixtures/nifi-1.28.1:/work:ro" flowport:ci analyze /work/flow.json.gz --fail-on never

  slow:
    name: Large input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -m slow

  integration:
    name: NiFi 1.28.1 and 2.12.0 (Docker)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pull NiFi images
        run: docker pull apache/nifi:1.28.1 && docker pull apache/nifi:2.12.0
      - name: Test
        run: pytest -m integration
