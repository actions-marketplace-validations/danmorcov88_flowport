[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flowport"
version = "0.2.0"
description = "Analyze and migrate Apache NiFi 1.x flows for NiFi 2.x"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dan Morcov" }]
keywords = ["nifi", "migration", "dataflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/danmorcov88/flowport"
Issues = "https://github.com/danmorcov88/flowport/issues"

[project.scripts]
flowport = "flowport.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flowport"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["flowport"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that need Docker and a running NiFi",
  "slow: tests that take more than a few seconds (large generated inputs)",
]
addopts = "-m 'not integration and not slow'"
